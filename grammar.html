<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แผนที่แกรมม่า N5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and clear
   IDEA a hand-drawn study mind map on dotted notebook paper
   PICTURE the map itself: a hub, ten icon branches, each opening into grammar pills
   COLOUR indigo band (same as the N5 cards), white paper, one hue per branch, vermilion accent
   TYPE Zen Maru Gothic for Japanese + Noto Sans Thai
   LAYOUT laptop: radial map fills the screen, detail sheet slides in from the right; phone: hub on top, branches in a grid, bottom sheet */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f8,#0e1424);--band:light-dark(#1f3a6b,#16264a);--paper:light-dark(#ffffff,#141c33);--card:light-dark(#ffffff,#1c2742);--ink:light-dark(#141a2b,#eef1f8);--soft:light-dark(#5b6479,#a8b1c8);--line:light-dark(#d9dde6,#2e3b5c);--dot:light-dark(#dfe3ec,#26304c);--shu:#d7372b;--ok:light-dark(#1f8a4c,#4cc283)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Thai","Zen Maru Gothic",system-ui,sans-serif;overflow-x:clip}
.jp{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif}
.band{background:var(--band);color:#fff;padding:18px max(5vw,16px) 16px}
.top{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:end;justify-content:space-between}
.home{display:block;color:#fff;opacity:.85;font-size:14px;text-decoration:none;margin-bottom:4px}
.home:hover{opacity:1;text-decoration:underline}
h1{margin:0;font:700 clamp(28px,4vw,40px)/1.1 "Zen Maru Gothic","Noto Sans Thai",sans-serif}
h1 small{display:block;font:500 15px/1.4 "Noto Sans Thai",sans-serif;opacity:.8;margin-top:6px}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}
.crumb button{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:999px;padding:8px 14px;font:500 15px "Noto Sans Thai",sans-serif;cursor:pointer;min-height:40px}
.crumb span{opacity:.9}
main{max-width:1200px;margin:0 auto;padding:18px max(3vw,12px) 40px}
.map{position:relative;background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;border:1px solid var(--line);border-radius:24px;overflow:hidden;min-height:420px;transition:height .3s}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map path{fill:none;stroke-width:2.5;stroke-linecap:round;opacity:.55}
.node{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;animation:pop .35s ease both}
.node .ic{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000),0 10px 22px -12px color-mix(in srgb,var(--c) 80%,#000);transition:transform .15s}
.node .ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.node:hover .ic{transform:translateY(-2px)}
.node .lb{font-weight:700;font-size:15px;line-height:1.25;text-align:center;max-width:8.5em;background:var(--paper);padding:0 4px;border-radius:6px}
.node .lb small{display:block;font-weight:500;font-size:13px;color:var(--soft)}
.hub .ic{width:112px;height:112px;background:var(--band);box-shadow:0 4px 0 #0f1c3a,0 14px 30px -14px #0f1c3a}
.hub .ic svg{width:40px;height:40px}
.hub .ic b{display:block;font:900 20px/1 "Zen Maru Gothic",sans-serif;margin-top:4px}
.hub .ic div{display:grid;place-items:center}
.pill{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border:2px solid var(--c);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 14px;cursor:pointer;text-align:center;min-height:48px;font:inherit;animation:pop .35s ease both;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 45%,transparent)}
.pill b{display:block;font:700 17px/1.3 "Zen Maru Gothic",sans-serif;white-space:nowrap}
.pill small{display:block;font-size:13px;color:var(--soft);white-space:nowrap;line-height:1.3}
.pill:hover{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.pill.seen::after{content:"";position:absolute;right:-6px;top:-6px;width:16px;height:16px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
button:focus-visible,a:focus-visible{outline:3px solid #f2a33a;outline-offset:3px}
.hint{margin:12px 4px 0;font-size:14px;color:var(--soft)}
.shade{position:fixed;inset:0;background:#0b1020;opacity:.35;z-index:9}
.sheet{position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 40px -24px #0006;overflow-y:auto;padding:22px 24px 30px;animation:slide .25s ease both}
.sheet .x{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:3px 12px}
.sheet h2{font:700 clamp(30px,6vw,40px)/1.15 "Zen Maru Gothic",sans-serif;margin:14px 0 2px}
.sheet .s{font-size:19px;font-weight:700;margin:0 0 14px}
.form{background:color-mix(in srgb,var(--c) 10%,var(--card));border-left:4px solid var(--c);border-radius:8px;padding:10px 14px;font:700 18px/1.5 "Zen Maru Gothic",sans-serif;margin:0 0 14px}
.sheet h3{font-size:15px;color:var(--soft);font-weight:500;margin:18px 0 8px}
.ex{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ex .j{font:500 18px/1.5 "Zen Maru Gothic",sans-serif}
.ex .t{grid-column:1;font-size:15px;color:var(--soft)}
.ex button{grid-row:1/3;grid-column:2;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ex button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{margin-top:14px;background:color-mix(in srgb,var(--shu) 9%,var(--card));border:1px solid color-mix(in srgb,var(--shu) 35%,transparent);border-radius:12px;padding:10px 14px;font-size:15px}
.note b{color:var(--shu)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;margin-top:4px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:color-mix(in srgb,var(--c) 10%,var(--card));font-weight:700}
td.jp,td .jp{font-size:16px}
.nav{display:flex;gap:10px;margin-top:22px}
.nav button{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px "Noto Sans Thai",sans-serif;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@media(max-width:640px){.ov .node .ic{width:50px;height:50px}.ov .node .ic svg{width:24px;height:24px}.ov .node .lb{font-size:13px;max-width:6.6em}.ov .node .lb small{display:none}.ov .hub .ic{width:86px;height:86px}.ov .hub .ic svg{width:30px;height:30px}.ov .hub .ic b{font-size:17px}}
@media(max-width:600px){.sheet{top:auto;left:0;width:100%;max-height:82vh;border-left:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;animation-name:up}.node .ic{width:62px;height:62px}.node .ic svg{width:28px;height:28px}.hub .ic{width:96px;height:96px}.node .lb{font-size:14px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.node,.pill,.sheet{animation:none}.map{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div class="top">
    <h1><a class="home" href="index.html">← หน้าหลัก</a>แผนที่แกรมม่า N5<small>กดไอคอนเพื่อแตกหัวข้อ แล้วกดแกรมม่าแต่ละตัวเพื่อดูคำอธิบาย</small></h1>
    <nav class="crumb" id="crumb" aria-label="ตำแหน่ง"></nav>
  </div>
</header>
<main>
  <div class="map" id="map"><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div></div>
  <p class="hint" id="hint"></p>
</main>
<div class="shade" id="shade" hidden></div>
<aside class="sheet" id="sheet" hidden aria-live="polite"></aside>
<script>
{
const IC={

heart:'<path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/>',

const SPK='<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const T=(head,rows)=>`<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td class="jp">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

/* grammar content */
const G=[
{id:"basic",t:"ประโยคพื้นฐาน",j:"です・だ",ic:"bubble",c:"#2f6fd6",items:[

 {k:"でした",s:"อดีต",f:"N でした／N じゃありませんでした",d:"บอกสิ่งที่เป็นในอดีต และรูปปฏิเสธของอดีต",ex:[["きのうは休みでした。","เมื่อวานเป็นวันหยุด"],["きのうは雨じゃありませんでした。","เมื่อวานไม่ใช่วันที่ฝนตก"]]},
 {k:"〜ですか",s:"ประโยคคำถาม",f:"ประโยค ＋ か",d:"เติม か ท้ายประโยคก็เป็นคำถามได้ทันที ตอบด้วย はい／いいえ",ex:[["学生ですか。","เป็นนักเรียนหรือเปล่า"],["はい、そうです。／いいえ、ちがいます。","ใช่ครับ / ไม่ใช่ครับ"]]},
 {k:"も",s:"ก็...เหมือนกัน",f:"N も 〜",d:"ใช้แทน は เมื่อเรื่องนั้นเหมือนกับที่พูดไปแล้ว",ex:[["わたしも学生です。","ฉันก็เป็นนักเรียนเหมือนกัน"]]},

]},
{id:"part",t:"คำช่วย",j:"助詞",ic:"link",c:"#d7372b",items:[

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let seen=new Set();
try{seen=new Set(JSON.parse(localStorage.getItem("n5gram-seen")||"[]"))}catch(e){}
const saveSeen=()=>{try{localStorage.setItem("n5gram-seen",JSON.stringify([...seen]))}catch(e){}};
let view=null,openK=null;
const map=$("map"),nodesEl=$("nodes"),svg=$("lines");
const total=G.reduce((a,g)=>a+g.items.length,0);

function speak(t){
  try{const u=new SpeechSynthesisUtterance(t.replace(/[（(][^）)]*[）)]/g,""));u.lang="ja-JP";u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ja"));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function crumb(){
  const g=view===null?null:G[view];
  $("crumb").innerHTML=g?`<button id="back">← แผนที่ทั้งหมด</button><span>${esc(g.t)}</span>`:`<span>อ่านแล้ว ${[...seen].length} / ${total} หัวข้อ</span>`;
  if(g)$("back").onclick=()=>go(null);
  $("hint").textContent=g?`${g.items.length} หัวข้อในกลุ่ม "${g.t}" · จุดสีเขียว = อ่านแล้ว`:"กดไอคอนกลุ่มเพื่อแตกหัวข้อแกรมม่า";
}
function iconNode(g,i){return `<button class="node" data-g="${i}" style="--c:${g.c}"><span class="ic"><svg viewBox="0 0 24 24">${IC[g.ic]}</svg></span><span class="lb">${esc(g.t)}<small class="jp">${esc(g.j)}</small></span></button>`}
function build(){
  crumb();
  map.classList.toggle("ov",view===null);
  if(view===null){
    nodesEl.innerHTML=`<button class="node hub" id="hub" style="--c:var(--band)"><span class="ic"><div><svg viewBox="0 0 24 24">${IC.book}</svg><b>N5文法</b></div></span></button>`+G.map(iconNode).join("");
  }else{
    const g=G[view];
    nodesEl.innerHTML=`<button class="node hub" id="hub" style="--c:${g.c}"><span class="ic" style="background:${g.c};box-shadow:0 4px 0 color-mix(in srgb,${g.c} 60%,#000)"><div><svg viewBox="0 0 24 24">${IC[g.ic]}</svg></div></span><span class="lb">${esc(g.t)}<small class="jp">${esc(g.j)}</small></span></button>`+
      g.items.map((it,i)=>`<button class="pill${seen.has(g.id+i)?" seen":""}" data-i="${i}" style="--c:${g.c};animation-delay:${i*25}ms"><b>${esc(it.k)}</b><small>${esc(it.s)}</small></button>`).join("");
  }
  layout();
}
function layout(){
  const W=map.clientWidth,wide=W>=(view===null?760:(G[view].items.length>9?980:820));
  const kids=[...nodesEl.children].slice(1),hub=nodesEl.children[0];
  const sz=kids.map(k=>[k.offsetWidth,k.offsetHeight]);
  let H,cx,cy,pos=[];
  if(view===null){
    const n=kids.length;
    if(W>=640){const r=Math.min(W/2-90,300);H=2*r+170;cx=W/2;cy=H/2;pos=kids.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]})}
    else{const rx=W/2-44,ry=255;H=2*ry+130;cx=W/2;cy=H/2;pos=kids.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+rx*Math.cos(a),cy+ry*Math.sin(a)]})}
  }else if(wide){
    const n=kids.length,maxW=Math.max(...sz.map(s=>s[0]));
    H=view===null?620:Math.max(560,Math.min(720,300+n*28));
    cx=W/2;cy=H/2;
    const rx=W/2-maxW/2-24,ry=H/2-Math.max(...sz.map(s=>s[1]))/2-22;
    pos=kids.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+rx*Math.cos(a),cy+ry*Math.sin(a)]});
  }else{
    const cols=W>=520?3:2,cw=(W-24)/cols,rh=84,top=200;
    cx=W/2;cy=90;
    pos=kids.map((_,i)=>[12+cw*(i%cols+.5),top+Math.floor(i/cols)*rh]);
    H=top+Math.ceil(kids.length/cols)*rh-rh/2+56;
  }
  map.style.height=H+"px";
  hub.style.left=cx+"px";hub.style.top=cy+"px";
  kids.forEach((k,i)=>{let[x,y]=pos[i];const hw=sz[i][0]/2+8;x=Math.max(hw,Math.min(W-hw,x));k.style.left=x+"px";k.style.top=y+"px";pos[i]=[x,y]});
  const col=view===null?null:G[view].c;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML=pos.map(([x,y],i)=>{
    const c=col||G[i].c;
    const d=(wide||view===null)?`M${cx},${cy} Q${(cx+x)/2+(y-cy)*.12},${(cy+y)/2-(x-cx)*.12} ${x},${y}`:`M${cx},${cy+40} C${cx},${(cy+y)/2+20} ${x},${(cy+y)/2-10} ${x},${y-30}`;
    return `<path d="${d}" stroke="${c}"/>`;
  }).join("");
}
function go(v){view=v;closeSheet();build();try{map.scrollIntoView({block:"nearest"})}catch(e){}}
function openSheet(gi,i){
  const g=G[gi],it=g.items[i];openK=[gi,i];
  seen.add(g.id+i);saveSeen();
  const pill=nodesEl.querySelector(`.pill[data-i="${i}"]`);if(pill)pill.classList.add("seen");
  crumb();
  const s=$("sheet");s.style.setProperty("--c",g.c);
  s.innerHTML=`<button class="x" id="x" aria-label="ปิด">×</button>
    <span class="chip">${esc(g.t)} · ${i+1}/${g.items.length}</span>
    <h2>${esc(it.k)}</h2><p class="s">${esc(it.s)}</p>
    <div class="form">${esc(it.f)}</div>
    <p>${esc(it.d)}</p>
    ${it.tb?`<h3>ตารางการผัน</h3>${it.tb}`:""}
    <h3>ตัวอย่าง</h3>
    <ul class="ex">${it.ex.map((e,k)=>`<li><span class="j">${esc(e[0])}</span><span class="t">${esc(e[1])}</span><button data-s="${k}" aria-label="ฟังเสียง">${SPK}</button></li>`).join("")}</ul>
    ${it.n?`<div class="note"><b>ระวัง</b> · ${it.n}</div>`:""}
    <div class="nav"><button id="pv" ${i===0?"disabled":""}>← ก่อนหน้า</button><button id="nx" ${i===g.items.length-1?"disabled":""}>ถัดไป →</button></div>`;
  s.hidden=false;$("shade").hidden=false;s.scrollTop=0;
  $("x").onclick=closeSheet;
  $("pv").onclick=()=>openSheet(gi,i-1);$("nx").onclick=()=>openSheet(gi,i+1);
  s.querySelectorAll(".ex button").forEach(b=>b.onclick=()=>speak(it.ex[+b.dataset.s][0]));
  try{$("x").focus({preventScroll:true})}catch(e){}
}
function closeSheet(){$("sheet").hidden=true;$("shade").hidden=true;openK=null}

nodesEl.addEventListener("click",e=>{
  const n=e.target.closest(".node,.pill");if(!n)return;
  if(n.id==="hub"){if(view!==null)go(null);return}
  if(n.dataset.g!==undefined)go(+n.dataset.g);
  else if(n.dataset.i!==undefined)openSheet(view,+n.dataset.i);
});
$("shade").onclick=closeSheet;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(openK)closeSheet();else if(view!==null)go(null)}
  if(openK&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const[gi,i]=openK,j=i+(e.key==="ArrowRight"?1:-1);if(j>=0&&j<G[gi].items.length)openSheet(gi,j)}
});
let lw=0;const ro=new ResizeObserver(()=>{if(map.clientWidth!==lw){lw=map.clientWidth;layout()}});ro.observe(map);
try{speechSynthesis.getVoices()}catch(e){}
build();
try{document.fonts.ready.then(layout)}catch(e){}
}
</script>
</body>
